    function formatINR(amount, compact = false) {
      if (isNaN(amount)) return '₹0';
      if (compact) {
        if (amount >= 10000000) return `₹${(amount / 10000000).toFixed(2)} Cr`;
        if (amount >= 100000) return `₹${(amount / 100000).toFixed(1)} Lakh`;
        if (amount >= 1000) return `₹${(amount / 1000).toFixed(0)}k`;

        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0,

    function calculateSolarMetrics(monthlyBillINR) {
      const ratePerKwh = 8.5;
      const monthlyKwh = monthlyBillINR / ratePerKwh;
      const dailyKwhNeeded = monthlyKwh / 30;
      const peakSunHours = 5.0;

      const rawKwNeeded = dailyKwhNeeded / (peakSunHours * 0.82);
      const systemSizeKw = Math.max(1.0, parseFloat(rawKwNeeded.toFixed(1)));
      
      const panelWattage = 500;
      const panelsCount = Math.ceil((systemSizeKw * 1000) / panelWattage);
      const roofSpaceSqFt = Math.ceil(panelsCount * 22);

      const dailyGenerationUnits = Math.round(systemSizeKw * peakSunHours * 0.85);
      const monthlyGenerationUnits = dailyGenerationUnits * 30;

      else if (systemSizeKw <= 2) subsidyINR = 60000;
      else subsidyINR = 78000;

      const netSystemCostINR = Math.max(10000, systemCostBeforeSubsidy - subsidyINR);

        systemSizeKw,
        panelsCount,
        roofSpaceSqFt,

        monthlyGenerationUnits,
        estAnnualSavingsINR,

        systemCostBeforeSubsidy,
        subsidyINR,
        netSystemCostINR,
        paybackYears

    }

                    <label className="block text-slate-300 font-bold mb-1">Your Full Name *</label>
                    <input name="modalName" type="text" required placeholder="e.g. Ramesh Singh" className="w-full p-3 rounded-xl bg-navy-800 border border-white/15 text-white placeholder:text-slate-500 focus:outline-none focus:border-solar-orange" />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Mobile / WhatsApp Number *</label>
                    <input name="modalPhone" type="tel" required placeholder="e.g. 9876543210" className="w-full p-3 rounded-xl bg-navy-800 border border-white/15 text-white placeholder:text-slate-500 focus:outline-none focus:border-solar-orange" />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Sultanpur Area</label>
                      <input name="modalLocality" type="text" placeholder="e.g. Mahuwariya" className="w-full p-3 rounded-xl bg-navy-800 border border-white/15 text-white placeholder:text-slate-500 focus:outline-none focus:border-solar-orange" />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Monthly Bill</label>
                      <select name="modalBill" className="w-full p-3 rounded-xl bg-navy-800 border border-white/15 text-slate-200 focus:outline-none focus:border-solar-orange">
                        <option value="₹2,000 – ₹5,000">₹2k – ₹5k</option>
                        <option value="₹5,000 – ₹10,000">₹5k – ₹10k</option>
                        <option value="₹10,000+">₹10k+</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Additional Requirement / Note</label>
                    <textarea name="modalMsg" rows="2" placeholder="e.g. Need 5kW system for 2-floor house" className="w-full p-3 rounded-xl bg-navy-800 border border-white/15 text-white placeholder:text-slate-500 focus:outline-none focus:border-solar-orange resize-none"></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3.5 rounded-xl font-extrabold text-slate-950 bg-gradient-to-r from-solar-orange via-solar-amber to-solar-yellow text-xs flex items-center justify-center gap-2 shadow-lg hover:scale-[1.02] active:scale-95 transition-all mt-2"
                  >
                    <Icon name="message-circle" className="w-4 h-4 text-slate-950" /> Send Details to WhatsApp (+91 70682 86755)
                  </button>

                  <button type="button" onClick={() => setModalOpen(false)} className="w-full py-2.5 rounded-xl font-semibold text-slate-400 bg-white/5 border border-white/10 text-xs">
                    Cancel
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
