    const { useState, useEffect, useRef } = React;

    function getWhatsAppUrl(customMessage = '') {
      const defaultText = customMessage || "Namaste! I am exploring Solar Panel Basics and would like to get a free customized solar consultation and quote.";
      return `https://wa.me/917068286755?text=${encodeURIComponent(defaultText)}`;
    }

    function formatINR(amount, compact = false) {
      if (isNaN(amount)) return '₹0';
      if (compact) {
        if (amount >= 10000000) return `₹${(amount / 10000000).toFixed(2)} Cr`;
        if (amount >= 100000) return `₹${(amount / 100000).toFixed(1)} Lakh`;
        if (amount >= 1000) return `₹${(amount / 1000).toFixed(0)}k`;
      }
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0,
      }).format(amount);
    }

    function calculateSolarMetrics(monthlyBillINR, sunFactor = 1.0, systemType = 'on-grid') {
      const ratePerKwh = 8.5;
      const monthlyKwh = monthlyBillINR / ratePerKwh;
      const dailyKwhNeeded = monthlyKwh / 30;
      const peakSunHours = 5.0 * sunFactor;

      const rawKwNeeded = dailyKwhNeeded / (peakSunHours * 0.82);
      const systemSizeKw = Math.max(1.0, parseFloat(rawKwNeeded.toFixed(1)));
      
      const panelWattage = 450; // Modern 450W Mono PERC panel
      const panelsCount = Math.ceil((systemSizeKw * 1000) / panelWattage);
      const roofSpaceSqFt = Math.ceil(panelsCount * 22);

      const dailyGenerationUnits = Math.round(systemSizeKw * peakSunHours * 0.85);
      const monthlyGenerationUnits = dailyGenerationUnits * 30;
      const estAnnualSavingsINR = Math.round(monthlyGenerationUnits * ratePerKwh * 12 * 0.95);
      const est25YrSavingsINR = Math.round(estAnnualSavingsINR * 25 * 1.3);

      let systemCostBeforeSubsidy = Math.round(systemSizeKw * 55000);
      if (systemType === 'hybrid') systemCostBeforeSubsidy += Math.round(systemSizeKw * 22000);

      // PM Surya Ghar Subsidy Rules:
      // Up to 2 kW: ₹30,000 / kW (Max ₹60,000)
      // 3 kW and above: ₹78,000 max flat subsidy
      let subsidyINR = 0;
      if (systemSizeKw <= 1) subsidyINR = 30000;
      else if (systemSizeKw <= 2) subsidyINR = 60000;
      else subsidyINR = 78000;

      const netSystemCostINR = Math.max(10000, systemCostBeforeSubsidy - subsidyINR);
      const paybackYears = parseFloat((netSystemCostINR / estAnnualSavingsINR).toFixed(1));

      return {
        monthlyBill: monthlyBillINR,
        systemSizeKw,
        panelsCount,
        panelWattage,
        roofSpaceSqFt,
        dailyGenerationUnits,
        monthlyGenerationUnits,
        estAnnualSavingsINR,
        est25YrSavingsINR,
        systemCostBeforeSubsidy,
        subsidyINR,
        netSystemCostINR,
        paybackYears: Math.max(2.5, paybackYears),
      };
    }

                      <button onClick={() => setSunFactor(1.0)} className={`py-2 rounded-xl text-xs font-semibold border ${sunFactor === 1.0 ? 'bg-orange-500/20 border-orange-500 text-orange-300' : 'bg-white/5 border-white/10 text-slate-400'}`}>Full Sun</button>
                      <button onClick={() => setSunFactor(1.15)} className={`py-2 rounded-xl text-xs font-semibold border ${sunFactor === 1.15 ? 'bg-orange-500/20 border-orange-500 text-orange-300' : 'bg-white/5 border-white/10 text-slate-400'}`}>Peak Exposure</button>
                    </div>
                  </div>

                  {/* System Technical Sizing Output */}
                  <div className="grid grid-cols-2 gap-4 p-4 rounded-2xl bg-white/[0.02] border border-white/10 text-xs">
                    <div>
                      <span className="text-slate-400 block">Rec. Capacity</span>
                      <span className="text-lg font-extrabold text-white">{metrics.systemSizeKw} kW</span>
                      <span className="text-[10px] text-slate-400 block">({metrics.panelsCount} x {metrics.panelWattage}W Mono Panels)</span>
                    </div>
                    <div>
                      <span className="text-slate-400 block">Est. Roof Area</span>
                      <span className="text-lg font-extrabold text-white">{metrics.roofSpaceSqFt} sq.ft</span>
                      <span className="text-[10px] text-slate-400 block">Unshaded Roof Space</span>
                    </div>
                  </div>

                </div>

                {/* Calculations Output Box */}
                <div className="lg:col-span-6 bg-gradient-to-b from-orange-950/40 via-slate-900 to-[#0F1117] border border-orange-500/30 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl">
                  
                  <div>
                    <span className="text-xs text-slate-400 block uppercase tracking-wider font-semibold">Estimated Daily Generation</span>
                    <div className="text-4xl font-black text-amber-400">
                      {metrics.dailyGenerationUnits} <span className="text-lg font-normal text-slate-300">Units (kWh) / day</span>
                    </div>
                    <span className="text-xs text-slate-400">~{metrics.monthlyGenerationUnits} Units saved monthly</span>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="p-4 rounded-2xl bg-white/[0.04] border border-white/10">
                      <span className="text-xs text-slate-400 block">Annual Bill Savings</span>
                      <span className="text-xl font-extrabold text-white">{formatINR(metrics.estAnnualSavingsINR)}</span>
                    </div>
                    <div className="p-4 rounded-2xl bg-white/[0.04] border border-white/10">
                      <span className="text-xs text-slate-400 block">25-Yr Lifetime Savings</span>
                      <span className="text-xl font-extrabold text-amber-300">{formatINR(metrics.est25YrSavingsINR, true)}</span>
                    </div>
                  </div>

                  {/* Financial Breakdown with PM Surya Ghar Subsidy */}
                  <div className="p-4 rounded-2xl bg-orange-500/10 border border-orange-500/20 space-y-2 text-xs">
                    <div className="flex justify-between text-slate-300">
                      <span>Gross Installation Cost:</span>
                      <span>{formatINR(metrics.systemCostBeforeSubsidy)}</span>
                    </div>
                    <div className="flex justify-between text-emerald-400 font-extrabold">
                      <span>PM Surya Ghar Govt Subsidy:</span>
                      <span>-{formatINR(metrics.subsidyINR)}</span>
                    </div>
                    <div className="flex justify-between text-white font-black pt-2 border-t border-white/10 text-sm">
                      <span>Net Investment:</span>
                      <span className="text-amber-400">{formatINR(metrics.netSystemCostINR)}</span>
                    </div>
                    <div className="text-[11px] text-slate-400 text-right pt-1">
                      Estimated Payback Period: <strong className="text-white">{metrics.paybackYears} Years</strong>
                    </div>
                  </div>

                  <button
                    onClick={() => handleOpenModal(`Solar Calculator Result - ${metrics.systemSizeKw}kW System (${formatINR(monthlyBill)} bill)`)}
                    className="w-full py-4 rounded-xl font-black text-slate-950 bg-gradient-to-r from-orange-500 via-amber-400 to-yellow-400 hover:from-orange-400 shadow-lg text-sm flex items-center justify-center gap-2 transition-all"
                  >
                    Lock In Quote & Claim Subsidy <Icon name="arrow-right" className="w-4 h-4" />
                  </button>

                </div>

              </div>

            </div>
          </section>

          {/* SECTION 5: SOLAR MYTHS VS FACTS (INTERACTIVE ACCORDION) */}
          <section id="myths" className="py-24 bg-[#0F1117] border-t border-white/10">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
              
              <div className="text-center space-y-4">
                <span className="text-xs font-extrabold text-orange-400 uppercase tracking-widest bg-orange-500/10 px-4 py-1.5 rounded-full border border-orange-500/30">
                  Solar Misconceptions Cleared
                </span>
                <h2 className="text-3xl sm:text-5xl font-black text-white">Solar Panel Myths vs Facts</h2>
                <p className="text-slate-300 text-sm sm:text-base">Click any myth below to reveal the actual engineering fact behind solar power performance.</p>
              </div>

              <div className="space-y-4">
                {[
                  {
                    myth: "MYTH #1: Solar panels don't produce power on rainy or cloudy days.",
                    fact: "FACT: False! Solar panels utilize light photons (UV & diffused daylight), not heat. Even under dense monsoon clouds, modern Mono PERC panels produce 15% to 30% of their rated output."
                  },
                  {
                    myth: "MYTH #2: Solar panels damage roof structures or cause leaks.",
                    fact: "FACT: False! Precision solar racking is anchored using rubberized waterproofing gaskets and elevated legs. Solar panels actually protect your roof tiles from harsh UV exposure and weathering!"
                  },
                  {
                    myth: "MYTH #3: Solar power plants are too expensive for common households.",
                    fact: "FACT: False! Under PM Surya Ghar Muft Bijli Yojana, direct bank subsidies up to ₹78,000 are provided. Zero-down EMI financing often makes monthly EMI lower than your existing DISCOM bill!"
                  },
                  {
                    myth: "MYTH #4: Solar panels require heavy daily maintenance and cleaning.",
                    fact: "FACT: False! Solar PV systems have zero moving parts. Natural rain cleans off most dust, and a simple water hose spray once or twice a month maintains peak 99% efficiency."
                  },
                  {
                    myth: "MYTH #5: Solar panels stop working after 10 years.",
                    fact: "FACT: False! Tier-1 solar panels come standard with 25-year linear performance warranties. They degrade by less than 0.5% annually and continue producing clean power for 30+ years."
                  },
                ].map((item, idx) => (
                  <div
                    key={idx}
                    onClick={() => setActiveMyth(activeMyth === idx ? null : idx)}
                    className="glass-card rounded-2xl p-5 border border-white/10 cursor-pointer transition-all hover:border-orange-500/40"
                  >
                    <div className="flex justify-between items-center gap-4">
                      <h4 className="text-sm sm:text-base font-bold text-amber-300 flex items-center gap-2">
                        <Icon name="help-circle" className="w-4 h-4 text-orange-400 shrink-0" />
                        {item.myth}
                      </h4>
                      <Icon name={activeMyth === idx ? "chevron-up" : "chevron-down"} className="w-5 h-5 text-slate-400 shrink-0" />
                    </div>
                    {activeMyth === idx && (
                      <div className="mt-4 pt-4 border-t border-white/10 text-xs sm:text-sm text-slate-200 leading-relaxed bg-orange-500/5 p-4 rounded-xl border border-orange-500/20 animate-fadeIn">
                        {item.fact}
                      </div>
                    )}
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* SECTION 6: INTERACTIVE SOLAR READINESS QUIZ */}
          <section id="quiz" className="py-24 bg-[#0F1117] border-t border-white/10">
            <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
              
              <div className="text-center space-y-4">
                <span className="text-xs font-extrabold text-orange-400 uppercase tracking-widest bg-orange-500/10 px-4 py-1.5 rounded-full border border-orange-500/30">
                  1-Minute Assessment
                </span>
                <h2 className="text-3xl sm:text-5xl font-black text-white">Is Solar Right for Your Roof?</h2>
                <p className="text-slate-300 text-sm">Answer 4 quick questions to receive a customized roof feasibility score and system recommendation.</p>
              </div>

              <div className="glass-card rounded-3xl p-6 sm:p-10 border border-orange-500/30 space-y-8 shadow-2xl relative">
                
                {quizFinished ? (
                  <div className="text-center space-y-6 py-6 animate-fadeIn">
                    <div className="w-20 h-20 mx-auto rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center text-3xl">
                      ✓
                    </div>
                    <div className="space-y-2">
                      <span className="text-xs font-bold text-emerald-400 uppercase tracking-widest">Feasibility Score: 96% Excellent Fit!</span>
                      <h3 className="text-3xl font-black text-white">Your Roof is Ideal For Solar Power!</h3>
                      <p className="text-xs text-slate-300 max-w-md mx-auto leading-relaxed">
                        Based on your inputs (<strong className="text-amber-400">{quizAnswers.property}</strong> with <strong className="text-amber-400">{quizAnswers.shading}</strong>), a <strong>3kW – 5kW Solar System</strong> can eliminate up to 90% of your power bills and qualify for ₹78,000 PM Surya Ghar subsidy!
                      </p>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3 justify-center pt-4">
                      <a
                        href={getWhatsAppUrl(`Namaste! I completed the Solar Basics Quiz on your website.\nProperty: ${quizAnswers.property}\nMonthly Bill: ${quizAnswers.bill}\nShade: ${quizAnswers.shading}\nPower Cuts: ${quizAnswers.powerCuts}\nPlease share recommended solar system proposal.`)}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="px-6 py-3.5 rounded-xl font-bold text-slate-950 bg-gradient-to-r from-emerald-400 to-amber-400 text-xs flex items-center justify-center gap-2 shadow-lg"
                      >
                        <Icon name="message-square" className="w-4 h-4" /> Send Quiz Result on WhatsApp
                      </a>
                      <button
                        onClick={() => { setQuizFinished(false); setQuizStep(1); }}
                        className="px-5 py-3.5 rounded-xl font-semibold text-slate-300 bg-white/5 border border-white/10 text-xs"
                      >
                        Retake Quiz
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {/* Stepper Progress Bar */}
                    <div className="flex justify-between items-center text-xs font-bold text-slate-400 pb-2 border-b border-white/10">
                      <span>Question {quizStep} of 4</span>
                      <span className="text-orange-400">{quizStep * 25}% Completed</span>
                    </div>

                    {/* Step 1 */}
                    {quizStep === 1 && (
                      <div className="space-y-4 animate-fadeIn">
                        <h4 className="text-lg font-bold text-white">1. What type of property do you own?</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          {['Independent House / Villa', 'Commercial Shop / Office', 'Apartment Rooftop', 'Agricultural Farm'].map((opt) => (
                            <button
                              key={opt}
                              onClick={() => { setQuizAnswers({...quizAnswers, property: opt}); setQuizStep(2); }}
                              className={`p-4 rounded-xl border text-left text-xs font-bold transition-all ${quizAnswers.property === opt ? 'bg-orange-500/20 border-orange-500 text-orange-300' : 'bg-white/5 border-white/10 text-slate-300 hover:bg-white/10'}`}
                            >
                              {opt}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Step 2 */}
                    {quizStep === 2 && (
                      <div className="space-y-4 animate-fadeIn">
                        <h4 className="text-lg font-bold text-white">2. What is your average monthly electricity bill?</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          {['Under ₹2,000 / month', '₹2,000 - ₹5,000 / month', '₹5,000 - ₹12,000 / month', 'Above ₹12,000 / month'].map((opt) => (
                            <button
                              key={opt}
                              onClick={() => { setQuizAnswers({...quizAnswers, bill: opt}); setQuizStep(3); }}
                              className={`p-4 rounded-xl border text-left text-xs font-bold transition-all ${quizAnswers.bill === opt ? 'bg-orange-500/20 border-orange-500 text-orange-300' : 'bg-white/5 border-white/10 text-slate-300 hover:bg-white/10'}`}
                            >
                              {opt}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Step 3 */}
                    {quizStep === 3 && (
                      <div className="space-y-4 animate-fadeIn">
                        <h4 className="text-lg font-bold text-white">3. How much sunlight exposure does your roof get?</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          {['Zero Shade (Full Sun 9 AM - 5 PM)', 'Minimal Shadow (Trees / Nearby Wall)', 'Heavy Shadow Most Days', 'Not Sure'].map((opt) => (
                            <button
                              key={opt}
                              onClick={() => { setQuizAnswers({...quizAnswers, shading: opt}); setQuizStep(4); }}
                              className={`p-4 rounded-xl border text-left text-xs font-bold transition-all ${quizAnswers.shading === opt ? 'bg-orange-500/20 border-orange-500 text-orange-300' : 'bg-white/5 border-white/10 text-slate-300 hover:bg-white/10'}`}
                            >
                              {opt}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Step 4 */}
                    {quizStep === 4 && (
                      <div className="space-y-4 animate-fadeIn">
                        <h4 className="text-lg font-bold text-white">4. Do you experience power grid outages in your area?</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          {['Frequent Daily Power Cuts', 'Occasional Outages', 'Rarely / Never', 'Need 24/7 Battery Backup'].map((opt) => (
                            <button
                              key={opt}
                              onClick={() => { setQuizAnswers({...quizAnswers, powerCuts: opt}); handleQuizSubmit(); }}
                              className={`p-4 rounded-xl border text-left text-xs font-bold transition-all ${quizAnswers.powerCuts === opt ? 'bg-orange-500/20 border-orange-500 text-orange-300' : 'bg-white/5 border-white/10 text-slate-300 hover:bg-white/10'}`}
                            >
                              {opt}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Step Nav Controls */}
                    <div className="flex justify-between pt-4 border-t border-white/10">
                      {quizStep > 1 && (
                        <button onClick={() => setQuizStep(quizStep - 1)} className="px-4 py-2 rounded-xl text-xs font-semibold bg-white/5 text-slate-300">
                          ← Back
                        </button>
                      )}
                    </div>
                  </div>
                )}

              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className="py-12 bg-[#08090C] border-t border-white/10 text-xs text-slate-400">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
              <div className="space-y-1 text-center md:text-left">
                <div className="flex items-center justify-center md:justify-start gap-2">
                  <span className="font-black text-white text-lg">SOLAR<span className="text-orange-500">BASICS</span> 101</span>
                </div>
                <p className="text-[11px] text-slate-400">Master Solar Energy, Photovoltaic Principles & PM Surya Ghar Subsidy Sizing.</p>
              </div>
              
              <div className="flex items-center gap-4">
                <a href={getWhatsAppUrl()} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1.5 font-bold hover:bg-emerald-500/30 transition-all">
                  <Icon name="message-square" className="w-4 h-4" /> WhatsApp Consultation ({PHONE_DISPLAY})
                </a>
              </div>
            </div>
          </footer>

          {/* MOBILE STICKY CTA */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-[#0F1117]/95 border-t border-orange-500/30 p-3 flex gap-2 backdrop-blur-md">
            <a
              href={getWhatsAppUrl("Namaste! I am visiting Solar Basics 101 website and want a free solar feasibility consultation.")}
              target="_blank"
              rel="noopener noreferrer"
              className="flex-1 py-3 font-bold text-slate-950 bg-gradient-to-r from-emerald-400 via-amber-400 to-yellow-400 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg"
            >
              <Icon name="message-square" className="w-4 h-4 text-emerald-950" /> Get Free Consultation on WhatsApp
            </a>
          </div>

          {/* MODAL FORM */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-[#121620] border border-orange-500/30 rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl">
                <div className="flex justify-between items-center border-b border-white/10 pb-4">
                  <div>
                    <h3 className="text-xl font-black text-white">Solar Basics Consultation</h3>
                    <p className="text-xs text-slate-400">{modalTopic}</p>
                  </div>
                  <button onClick={() => setModalOpen(false)} className="p-2 rounded-full bg-white/5 text-slate-300 hover:bg-white/10">✕</button>
                </div>

                <div className="space-y-4">
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Connect directly with a solar engineer to analyze your rooftop layout, calculate PM Surya Ghar subsidies, and receive a customized 3D solar array design.
                  </p>

                  <a
                    href={getWhatsAppUrl(`Namaste! I want an expert solar consultation regarding: ${modalTopic}`)}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-4 rounded-xl font-bold text-slate-950 bg-gradient-to-r from-emerald-400 via-amber-400 to-yellow-400 text-xs flex items-center justify-center gap-2 shadow-lg"
                  >
                    <Icon name="message-square" className="w-4 h-4 text-emerald-950" /> Chat Instantly on WhatsApp ({PHONE_DISPLAY})
                  </a>

                  <button
                    onClick={() => setModalOpen(false)}
                    className="w-full py-3 rounded-xl font-semibold text-slate-300 bg-white/5 border border-white/10 text-xs"
                  >
                    Close Window
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
