      if (isNaN(amount)) return '₹0';
      if (compact) {
        if (amount >= 10000000) return `₹${(amount / 10000000).toFixed(2)} Cr`;
        if (amount >= 100000) return `₹${(amount / 100000).toFixed(1)} Lakh`;
        if (amount >= 1000) return `₹${(amount / 1000).toFixed(0)}k`;

      return new Intl.NumberFormat('en-IN', {

        currency: 'INR',
        maximumFractionDigits: 0,

    function calculateSolarMetrics(monthlyBillINR, sunFactor = 1.0, systemType = 'on-grid') {
      const ratePerKwh = 8.5;
      const monthlyKwh = monthlyBillINR / ratePerKwh;
      const dailyKwhNeeded = monthlyKwh / 30;
      const peakSunHours = 5.0 * sunFactor;

      const rawKwNeeded = dailyKwhNeeded / (peakSunHours * 0.82);

      const panelWattage = 450;

      const roofSpaceSqFt = Math.ceil(panelsCount * 22);

      const dailyGenerationUnits = Math.round(systemSizeKw * peakSunHours * 0.85);
      const monthlyGenerationUnits = dailyGenerationUnits * 30;
      const estAnnualSavingsINR = Math.round(monthlyGenerationUnits * ratePerKwh * 12 * 0.95);

      let systemCostBeforeSubsidy = Math.round(systemSizeKw * 55000);

      let subsidyINR = 0;
      if (systemSizeKw <= 1) subsidyINR = 30000;
      else if (systemSizeKw <= 2) subsidyINR = 60000;
      else subsidyINR = 78000;

      const netSystemCostINR = Math.max(10000, systemCostBeforeSubsidy - subsidyINR);
      const paybackYears = parseFloat((netSystemCostINR / estAnnualSavingsINR).toFixed(1));

        monthlyBill: monthlyBillINR,
        systemSizeKw,
        panelsCount,
        panelWattage,
        roofSpaceSqFt,
        dailyGenerationUnits,
        monthlyGenerationUnits,
        estAnnualSavingsINR,
        est25YrSavingsINR,
        systemCostBeforeSubsidy,
        subsidyINR,
        netSystemCostINR,
        paybackYears: Math.max(2.5, paybackYears),
      };
    }
